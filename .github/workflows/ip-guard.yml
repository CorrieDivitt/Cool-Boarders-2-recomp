name: IP guard
# Fails any push or pull request that contains anything from the game disc.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan current tree
        run: python tools/ip_guard.py --tree
      - name: Scan every commit on this branch
        run: python tools/ip_guard.py --range HEAD
